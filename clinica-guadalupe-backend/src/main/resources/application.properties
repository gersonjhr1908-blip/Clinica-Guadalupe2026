spring.application.name=clinica-guadalupe-backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/clinica_guadalupe?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema ya se administra mediante scripts SQL. Evita ALTER TABLE automáticos
# y protege las tablas existentes en cada reinicio.
spring.jpa.hibernate.ddl-auto=none
# Evita saturar la consola con cada SELECT/INSERT ejecutado por Hibernate.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.jackson.time-zone=America/Lima

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=120
